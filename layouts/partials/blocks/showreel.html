{{ $d := .Site.Data.home }}

<section class="showreel" id="work">
  <div class="showreel__inner">
    <div class="showreel__head">
      <div class="showreel__eyebrow">
        {{ $d.showreel_eyebrow }}
      </div>

      <h2 class="showreel__title">
        {{ $d.showreel_title }}
      </h2>
    </div>

    <button
      class="showreel__main js-video-open"
      type="button"
      data-video="{{ $d.showreel_main_video }}"
      aria-label="{{ $d.showreel_main_alt }}"
      style="--showreel-image: url('{{ $d.showreel_main_image }}');"
    >
      <div class="showreel__main-content">
        {{ with $d.showreel_main_title }}
          <h3 class="showreel__main-title">
            {{ . }}
          </h3>
        {{ end }}

        {{ with $d.showreel_main_description }}
          <p class="showreel__main-description">
            {{ . }}
          </p>
        {{ end }}

        <div class="showreel__main-pill">
          <span>{{ $d.showreel_main_label_left }}</span>
          <strong>{{ $d.showreel_main_label_right }}</strong>
        </div>
      </div>

      <span class="showreel__play" aria-hidden="true">
        <span class="showreel__play-icon"></span>
      </span>
    </button>
  </div>

  <div class="video-modal" id="video-modal" aria-hidden="true">
    <button class="video-modal__backdrop js-video-close" type="button" aria-label="Close video"></button>

    <div class="video-modal__dialog" role="dialog" aria-modal="true" aria-label="Birdcast video player">
      <button class="video-modal__close js-video-close" type="button" aria-label="Close video">
        ×
      </button>

      <iframe
        class="video-modal__video"
        id="video-modal-player"
        title="Birdcast video player"
        allow="accelerometer; gyroscope; autoplay; encrypted-media; picture-in-picture;"
        allowfullscreen
        loading="lazy"
      ></iframe>
    </div>
  </div>
</section>

<script>
  (function () {
    const modal = document.getElementById("video-modal");
    const player = document.getElementById("video-modal-player");
    const openers = document.querySelectorAll(".showreel .js-video-open");
    const closers = document.querySelectorAll(".showreel .js-video-close");

    if (!modal || !player || !openers.length) return;

    function buildStreamUrl(src) {
      if (!src) return "";

      const cleanSrc = String(src).trim();

      if (cleanSrc.indexOf("iframe.videodelivery.net") !== -1) {
        return cleanSrc.indexOf("?") === -1
          ? cleanSrc + "?autoplay=true&muted=true"
          : cleanSrc + "&autoplay=true&muted=true";
      }

      return cleanSrc;
    }

    function openVideo(src) {
      const videoUrl = buildStreamUrl(src);
      if (!videoUrl) return;

      modal.classList.add("is-open");
      modal.setAttribute("aria-hidden", "false");

      player.removeAttribute("src");
      player.setAttribute("src", videoUrl);

      document.documentElement.classList.add("video-modal-open");
    }

    function closeVideo() {
      modal.classList.remove("is-open");
      modal.setAttribute("aria-hidden", "true");

      player.removeAttribute("src");

      document.documentElement.classList.remove("video-modal-open");
    }

    openers.forEach(function (button) {
      button.addEventListener("click", function () {
        openVideo(button.dataset.video);
      });
    });

    closers.forEach(function (button) {
      button.addEventListener("click", closeVideo);
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && modal.classList.contains("is-open")) {
        closeVideo();
      }
    });
  })();
</script>
